name: Radix First Review

on:
  pull_request:
    paths:
      - "concepts/**"
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: Shadow Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find changed concept files
        id: concepts
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const concepts = files
              .map(f => f.filename)
              .filter(f =>
                f.startsWith('concepts/') &&
                f.endsWith('.md') &&
                !f.includes('_template') &&
                !f.endsWith('README.md')
              );

            core.setOutput('files', concepts.join('\n'));
            core.setOutput('count', String(concepts.length));

      - name: Validate concept frontmatter
        id: validate
        if: steps.concepts.outputs.count != '0'
        shell: bash
        run: |
          ERRORS=""
          STATUSES=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue

            TITLE=$(grep '^title:' "$file" | head -1 | sed 's/^title:[[:space:]]*//' | tr -d '"')
            STATUS=$(grep '^status:' "$file" | head -1 | sed 's/^status:[[:space:]]*//')
            ENTERED=$(grep '^entered:' "$file" | head -1 | sed 's/^entered:[[:space:]]*//')

            if [ -z "$TITLE" ]; then
              ERRORS="${ERRORS}\n- \`${file}\`: missing title"
            fi
            if [ -z "$STATUS" ]; then
              ERRORS="${ERRORS}\n- \`${file}\`: missing status"
            elif ! echo "$STATUS" | grep -qE '^(shadow|emerging|graduated)$'; then
              ERRORS="${ERRORS}\n- \`${file}\`: invalid status \`${STATUS}\` (must be shadow, emerging, or graduated)"
            fi
            if [ -z "$ENTERED" ]; then
              ERRORS="${ERRORS}\n- \`${file}\`: missing entered date"
            fi

            STATUSES="${STATUSES}\n| \`$(basename "$file")\` | ${STATUS:-unknown} | ${TITLE:-untitled} |"
          done <<< "${{ steps.concepts.outputs.files }}"

          {
            echo "errors<<RADIX_EOF"
            printf '%b' "$ERRORS"
            echo "RADIX_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "statuses<<RADIX_EOF"
            printf '%b' "$STATUSES"
            echo "RADIX_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: steps.concepts.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const errors  = `${{ steps.validate.outputs.errors }}`.trim();
            const statuses = `${{ steps.validate.outputs.statuses }}`.trim();
            const count   = Number(`${{ steps.concepts.outputs.count }}`);

            const statusIcon = errors ? '⛔' : '✅';
            const statusLine = errors
              ? 'Validation failed — fix the issues below before merging.'
              : `All ${count} concept file(s) are structurally valid.`;

            const tableRows = statuses || '*(none)*';

            const body = [
              `## ${statusIcon} Radix First Review`,
              '',
              statusLine,
              '',
              '### Changed Concepts',
              '',
              '| File | Status | Title |',
              '|---|---|---|',
              tableRows,
              '',
              errors ? `### Validation Errors\n\n${errors}\n` : '',
              '### Review Checklist',
              '',
              'Shadow layer review — check before merging:',
              '',
              '- [ ] Does the concept have enough pressure to be named, or is it still formless?',
              '- [ ] Are the **open questions** honest — not rhetorical, but genuinely unresolved?',
              '- [ ] Are **connections** to other concepts and systems noted?',
              '- [ ] If status is `graduated` — is `graduated_to` filled in and does that origin exist?',
              '- [ ] If status is `emerging` — is there enough form here that it could graduate in the next session?',
              "- [ ] Does this concept belong in the shadow, or is it actually already someone else's origin?",
              '',
              '---',
              '*radix — the root beneath the root*',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Radix First Review')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
